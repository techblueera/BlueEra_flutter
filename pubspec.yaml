  # default ringtone (upstream 3.0.0 always forces a custom ringtoneSound). See
  # packages/flutter_callkit_incoming/ios/Classes/SwiftFlutterCallkitIncomingPlugin.swift
  flutter_callkit_incoming:
    path: packages/flutter_callkit_incoming

flutter_native_splash:
  color: "#ffffff"              # Background color for older Android versions
  image: assets/onboarding/sp_full.png    # Your splash image (logo)

  # Android 12+ Specific Settings (Crucial)
  android_12:
    image: assets/onboarding/sp_full.png # Should be a 1152x1152px image
    color: "#ffffff"                   # Background color
    icon_background_color: "#ffffff"
    # Optional: color behind the icon
  # IMPORTANT: If you re-run `dart run flutter_native_splash:create`, it will
  # overwrite android/app/src/main/res/values-v31/styles.xml and
  # values-night-v31/styles.xml back to the Android 12 icon API
  # (windowSplashScreenAnimatedIcon), which crops the splash to a small
  # centered icon. After regenerating, re-apply the manual fix in those
  # two files (use `windowBackground` -> @drawable/launch_background instead
  # of windowSplashScreenAnimatedIcon).
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator:
  build_runner:
  envied_generator:


flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/discover/
    - assets/discover_images/
    - assets/svg/
    - assets/icons/
    - assets/sound/
    - assets/category/medical/
    - assets/category/hotel_service/
    - assets/onboarding/individual/
    - assets/onboarding/business/
    - assets/category/foods/
    - assets/category/foods/menu/
    - assets/translations/
    - assets/onboarding/


  fonts:
    # Open Sans, full normal-width family. The app asks for w200-w900 across
    # thousands of TextStyles, but only 400 and 700 used to be bundled, so
    # every other weight got rounded to whichever of those two was nearest.
    # All six real weights are declared here so w500 / w600 / w800 render as
    # designed instead of snapping to Regular or Bold. Open Sans tops out at
    # 800, so w900 maps to ExtraBold and w200 to Light -- that is the family's
    # whole range. Italic faces are bundled alongside each weight: without an
    # italic face, a `fontStyle: FontStyle.italic` TextStyle silently falls
    # back to the upright face.
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
    - family: Arizonia
      fonts:
        - asset: assets/fonts/Arizonia.ttf
    - family: Artifika
      fonts:
        - asset: assets/fonts/Artifika.ttf
    - family: AsapCondensed
      fonts:
        - asset: assets/fonts/AsapCondensed.ttf


