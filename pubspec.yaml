dependency_overrides:
  intl: ^0.19.0

flutter_native_splash:
  color: "#ffffff"              # Background color for older Android versions
  image: assets/images/splash_img_new.png     # Your splash image (logo)

  # Android 12+ Specific Settings (Crucial)
  android_12:
    image: assets/images/splash_img_new.png # Should be a 1152x1152px image
    color: "#ffffff"                   # Background color
    icon_background_color: "#ffffff"
    # Optional: color behind the icon
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator:
  build_runner:
  envied_generator:


flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svg/
    - assets/icons/
    - assets/video/
    - assets/store/
    - assets/sound/
    - assets/category/grocery/menu/
    - assets/category/medical/
    - assets/category/hotel_service/
    - assets/onboarding/individual/
    - assets/onboarding/business/
    - assets/category/foods/
    - assets/category/foods/menu/
    - assets/category/food_home/


  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
    - family: Arizonia

      fonts:
        - asset: assets/fonts/Arizonia.ttf
    - family: Artifika
      fonts:
        - asset: assets/fonts/Artifika.ttf
    - family: AsapCondensed
      fonts:
        - asset: assets/fonts/AsapCondensed.ttf


