org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=37
# Run R8 in full mode (the AGP 8.0+ default) explicitly. Full mode optimizes and
# obfuscates more aggressively than compatibility mode; all reflection/JNI-reached
# classes must be covered by keep rules in app/proguard-rules.pro (Razorpay,
# WebRTC, Jitsi, Firebase, Flutter embedding, etc. are kept there). Any change to
# shrinking MUST be validated with a signed release smoke test, not just debug.
android.enableR8.fullMode=true
# Kotlin incremental compilation breaks when the Pub cache (C:\) and the project
# (D:\) live on different drives — the compiler can't relativise paths across
# drive roots ("this and base files have different roots"). Disabling it avoids
# the "Could not close incremental caches" failures on a clean build.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Point Gradle directly to Java 17 to bypass Android Studio Quail's bundled Java 25
org.gradle.java.home=C:/Program Files/Java/jdk-17

# --- Build performance on a memory-constrained machine (7.8 GB physical) ---
#
# The constraint here is RAM, not CPU. A release build was observed committing
# 22.5 GB against 7.8 GB physical, with the Gradle daemon holding only 231 MB
# resident of its 4 GB heap -- the rest paged out to disk, so every R8 GC pass
# faulted pages back from the SSD. That paging, not Gradle config, is what made
# bundleRelease take ~33 minutes.
#
# Consequently, do NOT raise org.gradle.jvmargs above -Xmx4G and do NOT enable
# org.gradle.parallel on this hardware: both increase the resident set and deepen
# the paging. Parallel is left at its default (off) deliberately. Revisit both if
# this project moves to a 16 GB+ machine.

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM for the
# Kotlin daemon. Trades a little daemon heap for ~1-2 GB of process overhead --
# the right side of that trade when physical RAM is the bottleneck. Safe here
# because kotlin.incremental is already off (see the cross-drive note above).
kotlin.compiler.execution.strategy=in-process

# Reuse task outputs across builds. Costs disk, not RAM, so it is a clear win here.
org.gradle.caching=true
