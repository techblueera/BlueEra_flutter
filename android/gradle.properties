org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=37
# NOTE: `android.enableR8=true` used to sit here. AGP removed that option in 7.0
# and 8.13 fails the build outright if it is still set. Dropping it changes
# nothing: R8 has been the one and only shrinker since 7.0, so it was already
# doing exactly this. `android.enableR8.fullMode` below is a *different*,
# still-supported option and must stay.
# Run R8 in full mode (the AGP 8.0+ default) explicitly. Full mode optimizes and
# obfuscates more aggressively than compatibility mode; all reflection/JNI-reached
# classes must be covered by keep rules in app/proguard-rules.pro (Razorpay,
# WebRTC, Jitsi, Firebase, Flutter embedding, etc. are kept there). Any change to
# shrinking MUST be validated with a signed release smoke test, not just debug.
android.enableR8.fullMode=true
# Kotlin incremental compilation breaks when the Pub cache (C:\) and the project
# (D:\) live on different drives — the compiler can't relativise paths across
# drive roots ("this and base files have different roots"). Disabling it avoids
# the "Could not close incremental caches" failures on a clean build.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# NOTE: do NOT set `org.gradle.java.home` here — this file is committed, so a
# JDK path that is valid on one machine breaks the build for everyone else.
# AGP 8.13 needs Java 17 (Android Studio Quail's bundled Java 25 is rejected).
# Set it per-machine in ~/.gradle/gradle.properties, or export JAVA_HOME.
