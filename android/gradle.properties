org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
android.enableR8=true
# R8 full mode: more aggressive dead-code elimination & class merging →
# smaller DEX and faster class loading on cold start.
android.enableR8.fullMode=true
# Kotlin incremental compilation breaks when the Pub cache (C:\) and the project
# (D:\) live on different drives — the compiler can't relativise paths across
# drive roots ("this and base files have different roots"). Disabling it avoids
# the "Could not close incremental caches" failures on a clean build.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
