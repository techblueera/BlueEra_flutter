pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
    // Uploads the R8 mapping file to Crashlytics on every minified build.
    // Without it, Crashlytics has nothing to retrace with: release stacks
    // arrive with the source file renamed to the literal "SourceFile" and
    // residual line numbers (proguard-android-optimize.txt applies
    // -renamesourcefileattribute), so a Kotlin frame reads
    // "RiderLocationForegroundService.onStartCommand (SourceFile:160)" and
    // cannot be mapped back to real source. Three native crashes had to be
    // identified structurally instead of retraced before this was added.
    id "com.google.firebase.crashlytics" version "3.0.6" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
//    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
//    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
