// Plugin versions are declared ONCE, in settings.gradle's `plugins {}` block
// (AGP, Kotlin, google-services). This file used to carry a second copy as a
// `buildscript { classpath ... }` block, which is the pre-plugins-DSL style: it
// pinned google-services to 4.3.13 here while settings.gradle asked for 4.3.15,
// and it declared a OneSignal plugin that nothing ever applies — with an open
// version range, so Gradle had to hit the network to re-resolve it on every
// build. AGP 9 drops support for that style entirely, and the Flutter 3.47
// template has no buildscript block at all. Add plugins in settings.gradle.
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://plugins.gradle.org/m2/" }
    }
}

// Flutter expects the build output at <repo>/build, not android/build, so the
// root build directory is redirected one level up.
//
// This was `rootProject.buildDir = '../build'`. `Project.buildDir` is removed in
// Gradle 9, so it now uses the provider API, matching the Flutter 3.47 template.
//
// NOTE the path is '../../build', not '../build'. The old setter resolved
// relative to the PROJECT directory (android/ + ../build = <repo>/build);
// layout.buildDirectory.dir() resolves relative to the BUILD directory
// (android/build/ + ../../build = <repo>/build). Same destination, one more
// level up. Getting this wrong silently moves every APK/AAB.
def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))

    afterEvaluate {
        if (it.hasProperty('android')) {
            // `compileSdkVersion` / `targetSdkVersion` as property setters are
            // removed in AGP 9 — `compileSdk` / `targetSdk` are the current form
            // and already work on AGP 8.
            it.android.compileSdk = 37
            it.android.defaultConfig.targetSdk = 36
            it.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            it.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17

            // `kotlinOptions` is removed in Kotlin 2.3; `compilerOptions` is the
            // replacement and takes a typed JvmTarget rather than a string.
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions {
                    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
