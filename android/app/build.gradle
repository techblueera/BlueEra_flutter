plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '327'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '14.0.68'
}

def mapApiKey = localProperties.getProperty('MAP_API_KEY')
if (!mapApiKey || mapApiKey.isEmpty()) {
    throw new GradleException("Missing MAP_API_KEY in local.properties")
}

android {
    namespace "ai.bluecs.app"
    compileSdk 36
    ndkVersion "29.0.14033849 rc4"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // ✅ This enables core library desugaring
        coreLibraryDesugaringEnabled true
    }
    lint {
        checkReleaseBuilds = false
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ai.bluecs.app"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 327
        versionName "14.0.68"
        manifestPlaceholders = [
                mapApiKey: mapApiKey
        ]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            // Fall back to the debug key when key.properties (release
            // keystore) is not present on this machine — yields an
            // installable release-mode build for device testing. NOT
            // uploadable to the Play Store; store uploads need the real
            // keystore + key.properties.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            // Use the OPTIMIZING default rules so R8 runs its optimization pass
            // (proguard-android.txt disables it). App-specific keep rules live in
            // proguard-rules.pro.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
    }

    configurations.all {
        exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21"
    implementation platform('com.google.firebase:firebase-bom:31.0.2')
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Watchdog that restarts the rider live-location foreground service after an
    // OEM kill. WorkManager is NOT the heartbeat (its floor is 15 minutes, far
    // too slow against the 5-minute provider auto-close) — it only checks that
    // the service is alive. See docs/RIDER_LIVE_LOCATION_GUIDE.md.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

}

flutter {
    source '../..'
}
