plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    // Must come after google-services: the mapping upload is addressed with
    // the Firebase app id that plugin reads out of google-services.json.
    id 'com.google.firebase.crashlytics'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '347'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '14.0.88'
}

def mapApiKey = localProperties.getProperty('MAP_API_KEY')
if (!mapApiKey || mapApiKey.isEmpty()) {
    throw new GradleException("Missing MAP_API_KEY in local.properties")
}

android {
    namespace "ai.bluecs.app"
    compileSdk 37
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // ✅ This enables core library desugaring
        coreLibraryDesugaringEnabled true
    }
    lint {
        checkReleaseBuilds = false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "ai.bluecs.app"
        minSdkVersion 26
        targetSdkVersion 36
        // Driven by pubspec.yaml, via the flutter.versionCode/versionName that
        // `flutter build` writes into local.properties. These were hardcoded to
        // 347 / "14.0.88", which silently won over both - so bumping the
        // version in pubspec changed nothing in the artifact, and every release
        // needed a second edit here that was easy to forget. A bundle built
        // against an already-published versionCode is rejected by Play, and the
        // only clue is a manifest that disagrees with pubspec.
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [
                mapApiKey: mapApiKey
        ]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            // Fall back to the debug key when key.properties (release
            // keystore) is not present on this machine — yields an
            // installable release-mode build for device testing. NOT
            // uploadable to the Play Store; store uploads need the real
            // keystore + key.properties.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            // Use the OPTIMIZING default rules so R8 runs its optimization pass
            // (proguard-android.txt disables it). App-specific keep rules live in
            // proguard-rules.pro.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Upload the R8 mapping file so Crashlytics can retrace release
            // stacks. On by default for a minified build type, but stated
            // explicitly: it is the difference between a readable crash and
            // "SourceFile:160", and a silent default is exactly the kind of
            // thing that gets switched off during an unrelated build cleanup.
            firebaseCrashlytics {
                mappingFileUploadEnabled true
            }
        }
        debug {
            // Debug is not minified, so there is no mapping to upload and the
            // task is pure build-time cost on every hot restart.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }
    packagingOptions {
        pickFirst "lib/**/libc++_shared.so"
    }

    bundle {
        abi {
            // Every ABI ships in the base APK instead of a per-ABI
            // split_config apk.
            //
            // With splitting on (the App Bundle default) all native code,
            // libflutter.so included, lives in the split. Installs that arrive
            // with the base and no split — sideloaded base-only APKs, some
            // third-party installers, interrupted Play installs, device-transfer
            // tools that copy only base.apk — therefore have no native libraries
            // at all, and the app dies during activity launch with
            // "Could not find 'libflutter.so'. Looked for: [arm64-v8a,
            // armeabi-v7a, armeabi], but only found: []" before any Dart runs.
            // Nothing in the app can catch that, so the only fix is to not
            // depend on the split arriving.
            //
            // The trade is download size: the base now carries arm64-v8a and
            // armeabi-v7a rather than one of them. Play Core's
            // MissingSplitsManagerFactory would report the broken state instead
            // at no size cost, but it ships only in the legacy monolithic
            // com.google.android.play:core, which duplicate-classes against the
            // app-update artifact in_app_update depends on.
            //
            // ── Re-enabled deliberately, accepting the above ─────────────────
            // The base-only-install crash described above IS reintroduced by
            // this. It was turned back on because the bundle reached 221.9 MB
            // with splitting off — every device downloading arm64-v8a AND
            // armeabi-v7a AND x86_64 — which is at the edge of what Play
            // accepts. Size won; the trade was made with the crash understood,
            // not forgotten.
            //
            // What that costs, concretely: an install that arrives with the
            // base and no ABI split has no native libraries, and dies at
            // activity launch with "Could not find 'libflutter.so'" before any
            // Dart runs, so it cannot be caught, logged, or reported — those
            // users are invisible in Crashlytics. Normal Play installs are
            // unaffected; sideloaded base-only APKs, some third-party
            // installers, interrupted installs and device-transfer tools are
            // not.
            //
            // If that starts showing up as silent installs-that-never-open, the
            // fix is a missing-splits guard, which needs the
            // com.google.android.play:core duplicate-classes conflict with
            // in_app_update resolved first.
            enableSplit = true
        }
    }

    configurations.all {
        exclude group: 'androidx.media3', module: 'media3-exoplayer-rtsp'
        // androidx.core is deliberately NOT forced to a fixed version any more.
        //
        // It used to be pinned to 1.15.0. Once the plugins moved to
        // androidx.activity 1.13.0, that pin became a crash on launch: activity's
        // ComponentActivity implements androidx.core.app.PictureInPictureProvider,
        // a class that only exists from core 1.16.0 on, so the app compiled
        // cleanly and then died in FirebaseInitProvider with
        // NoClassDefFoundError: androidx.core.app.PictureInPictureProvider.
        //
        // Forcing a LOWER version than the dependency graph asks for is what makes
        // this dangerous — the graph requests 1.18.0 and the force silently
        // downgraded it. If a pin is ever needed here again, pin it UP to the
        // highest requested version, never down.
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation platform('com.google.firebase:firebase-bom:31.0.2')
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Watchdog that restarts the rider live-location foreground service after an
    // OEM kill. WorkManager is NOT the heartbeat (its floor is 15 minutes, far
    // too slow against the 5-minute provider auto-close) — it only checks that
    // the service is alive. See docs/RIDER_LIVE_LOCATION_GUIDE.md.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

}

flutter {
    source '../..'
}
